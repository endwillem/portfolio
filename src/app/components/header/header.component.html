<header class="header">
  <div class="logo">
    <a routerLink="/">
      <img src="/images/logo_transparent.png" alt="logo_transparent" />
    </a>
  </div>

  <nav class="navigation-buttons">
    @for (button of buttons; track button.path) {
      <a [routerLink]="button.path" routerLinkActive="active" class="navigation-button">
        {{ button.label }}
      </a>
    }
  </nav>
</header>
