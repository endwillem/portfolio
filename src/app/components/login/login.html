@if (!user()) {
  <input type="email" [(ngModel)]="email" placeholder="E-mailadres" />

  <button (click)="login()">Verstuur loginlink</button>
} @else {
  <button (click)="logout()">Uitloggen</button>
}

<p>Gebruiker: {{ user()?.email }}</p>

@if (error() !== '') {
  <p class="error">{{ error() }}</p>
}
